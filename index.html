<div style="background:transparent;max-width:540px;margin:0 auto;">
  <div style="background:#0a0a0a;border-radius:20px;padding:32px 36px 28px;max-width:540px;margin:0 auto;text-align:center;font-family:Arial,sans-serif;">

  <div style="display:inline-block;border:2px solid #c9a227;border-radius:50px;padding:10px 26px;margin-bottom:24px;">
    <p style="color:#e8c84a;font-size:1.05rem;font-weight:700;margin:0;">
      Cupos disponibles hoy: <b id="fecha"></b>
    </p>
  </div>

  <div style="background:#1c1c1c;border-radius:50px;height:24px;overflow:hidden;margin-bottom:20px;">
    <div id="barra" style="height:100%;width:0%;border-radius:50px;background:linear-gradient(90deg,#b8860b,#f5c518,#ffe87a);transition:width 1s ease;"></div>
  </div>

  <p style="color:#fff;font-size:1.4rem;font-weight:800;margin-bottom:8px;">
    Cupos Reservados: <span id="reservados" style="color:#f5c518;"></span> de <span style="color:#f5c518;">40</span>
  </p>

  <p style="color:#777;font-size:0.84rem;line-height:1.5;max-width:320px;margin:0 auto;">
    Una vez agotados los cupos la página se bloqueará hasta tener nuevos espacios*
  </p>

</div>

<script>
var m=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
var d=new Date();
document.getElementById('fecha').innerHTML=d.getDate()+' de '+m[d.getMonth()]+' de '+d.getFullYear();
var r=Math.floor(Math.random()*13)+25;
document.getElementById('reservados').innerHTML=r;
setTimeout(function(){ document.getElementById('barra').style.width=Math.round(r/40*100)+'%'; },200);
</script>
